name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://utileasydoc:utileasydoc@localhost:5432/utileasydoc_test
      TEST_DATABASE_URL: postgresql+psycopg://utileasydoc:utileasydoc@localhost:5432/utileasydoc_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: utileasydoc_test
          POSTGRES_USER: utileasydoc
          POSTGRES_PASSWORD: utileasydoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utileasydoc -d utileasydoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
